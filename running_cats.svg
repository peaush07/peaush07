<svg width="854" height="80" viewBox="0 0 854 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Road Track */
    .road-line {
      stroke: #e3b341;
      stroke-width: 3;
      stroke-dasharray: 12 12;
      animation: road-move 0.8s linear infinite;
    }
    @keyframes road-move {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }

    /* Cat 1 Movement across screen */
    .cat1-group {
      animation: run-across-1 8s linear infinite;
    }
    @keyframes run-across-1 {
      0% { transform: translateX(-100px); }
      100% { transform: translateX(900px); }
    }

    /* Cat 2 Movement across screen */
    .cat2-group {
      animation: run-across-2 8s linear infinite;
    }
    @keyframes run-across-2 {
      0% { transform: translateX(-220px); }
      100% { transform: translateX(780px); }
    }

    /* Cat Leg & Bobbing Animation */
    .bobbing {
      animation: cat-bob 0.3s ease-in-out infinite alternate;
    }
    @keyframes cat-bob {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-4px); }
    }

    .leg-front-1 {
      animation: leg-run-front 0.3s ease-in-out infinite alternate;
      transform-origin: 30px 48px;
    }
    .leg-front-2 {
      animation: leg-run-back 0.3s ease-in-out infinite alternate;
      transform-origin: 30px 48px;
    }
    .leg-back-1 {
      animation: leg-run-back 0.3s ease-in-out infinite alternate;
      transform-origin: 15px 48px;
    }
    .leg-back-2 {
      animation: leg-run-front 0.3s ease-in-out infinite alternate;
      transform-origin: 15px 48px;
    }

    @keyframes leg-run-front {
      0% { transform: rotate(-25deg); }
      100% { transform: rotate(25deg); }
    }
    @keyframes leg-run-back {
      0% { transform: rotate(25deg); }
      100% { transform: rotate(-25deg); }
    }

    /* Tail Wiggle */
    .tail {
      animation: tail-wiggle 0.6s ease-in-out infinite alternate;
      transform-origin: 8px 38px;
    }
    @keyframes tail-wiggle {
      0% { transform: rotate(-15deg); }
      100% { transform: rotate(15deg); }
    }

    /* Yarn ball rolling */
    .yarn {
      animation: yarn-across 8s linear infinite, yarn-spin 0.5s linear infinite;
      transform-origin: 400px 58px;
    }
    @keyframes yarn-across {
      0% { transform: translateX(-40px) rotate(0deg); }
      100% { transform: translateX(960px) rotate(1440deg); }
    }
  </style>

  <!-- Road Base -->
  <rect x="0" y="55" width="854" height="25" fill="#161b22" rx="4" />
  <line x1="0" y1="67" x2="854" y2="67" class="road-line" />

  <!-- Yarn Ball Rolling Ahead -->
  <g class="yarn">
    <circle cx="-40" cy="56" r="8" fill="#ec4899" />
    <path d="M-44 56 C-40 50, -36 62, -32 56" stroke="#f472b6" stroke-width="1.5" fill="none" />
  </g>

  <!-- CAT 1: Black/Purplish Sleek Cat (Leading) -->
  <g class="cat1-group">
    <g class="bobbing">
      <!-- Tail -->
      <path class="tail" d="M 8 38 Q -5 20 2 10" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" fill="none" />
      
      <!-- Back Legs -->
      <line x1="15" y1="45" x2="10" y2="60" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" class="leg-back-1" />
      <line x1="15" y1="45" x2="20" y2="60" stroke="#6d28d9" stroke-width="4" stroke-linecap="round" class="leg-back-2" />

      <!-- Body -->
      <ellipse cx="25" cy="40" rx="18" ry="11" fill="#8b5cf6" />

      <!-- Front Legs -->
      <line x1="33" y1="45" x2="28" y2="60" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" class="leg-front-1" />
      <line x1="33" y1="45" x2="38" y2="60" stroke="#6d28d9" stroke-width="4" stroke-linecap="round" class="leg-front-2" />

      <!-- Head -->
      <circle cx="42" cy="32" r="10" fill="#8b5cf6" />

      <!-- Ears -->
      <polygon points="36,25 39,15 43,23" fill="#7c3aed" />
      <polygon points="43,23 48,15 50,26" fill="#7c3aed" />

      <!-- Eyes & Whiskers -->
      <circle cx="45" cy="30" r="2" fill="#facc15" />
      <line x1="48" y1="32" x2="56" y2="30" stroke="#ddd6fe" stroke-width="1" />
      <line x1="48" y1="34" x2="55" y2="35" stroke="#ddd6fe" stroke-width="1" />
    </g>
  </g>

  <!-- CAT 2: Orange Tabby Cat (Chasing) -->
  <g class="cat2-group">
    <g class="bobbing">
      <!-- Tail -->
      <path class="tail" d="M 8 38 Q -6 22 0 12" stroke="#f97316" stroke-width="4" stroke-linecap="round" fill="none" />

      <!-- Back Legs -->
      <line x1="15" y1="45" x2="10" y2="60" stroke="#ea580c" stroke-width="4" stroke-linecap="round" class="leg-back-1" />
      <line x1="15" y1="45" x2="20" y2="60" stroke="#c2410c" stroke-width="4" stroke-linecap="round" class="leg-back-2" />

      <!-- Body -->
      <ellipse cx="25" cy="40" rx="18" ry="11" fill="#f97316" />
      <!-- Tabby Stripes -->
      <path d="M 20 32 Q 22 38 20 44" stroke="#c2410c" stroke-width="2" fill="none" />
      <path d="M 26 31 Q 28 38 26 45" stroke="#c2410c" stroke-width="2" fill="none" />

      <!-- Front Legs -->
      <line x1="33" y1="45" x2="28" y2="60" stroke="#ea580c" stroke-width="4" stroke-linecap="round" class="leg-front-1" />
      <line x1="33" y1="45" x2="38" y2="60" stroke="#c2410c" stroke-width="4" stroke-linecap="round" class="leg-front-2" />

      <!-- Head -->
      <circle cx="42" cy="32" r="10" fill="#f97316" />

      <!-- Ears -->
      <polygon points="36,25 39,15 43,23" fill="#ea580c" />
      <polygon points="43,23 48,15 50,26" fill="#ea580c" />

      <!-- Eyes & Whiskers -->
      <circle cx="45" cy="30" r="2" fill="#38bdf8" />
      <line x1="48" y1="32" x2="56" y2="30" stroke="#ffedd5" stroke-width="1" />
      <line x1="48" y1="34" x2="55" y2="35" stroke="#ffedd5" stroke-width="1" />
    </g>
  </g>
</svg>
